<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-dark" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
  <title>Vibrant Worlds</title>
  <link rel="icon" type="image/png" href="images/avatar.png"> <!-- Update this with your own favicon -->

  <!-- Meta Description - Write a description (150-160 characters recommended) -->
  <meta name="description" content="Links to Vibrant Worlds, a studio creating Stories and TTRPG Content">

  <!-- Canonical URL - Helps prevent duplicate content issues -->
  <link rel="canonical" href="https://www.vibrantworlds.co.uk">

  <!-- Author Information -->
  <meta name="author" content="Owen Davies">

  <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

  <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
  <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Name">
    <meta property="og:description" content="A short description of your page.">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="https://yourwebsite.com/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">
    -->

  <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
  <link rel="preload"
    href="fonts/RobotoSlab-VariableFont_wght.ttf"
    as="font" type="font/trutype" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brands.css">

  <!-- LittleLink Extended Stylesheet (Optional) -->
  <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
  <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

</head>

<body>

  <div class="container">
    <div class="column">
      <main>

        <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
        <img class="avatar avatar--none" src="images/avatar.png" alt="Vibrant Worlds Logo" width="256" height="256"
          fetchpriority="high">

        <!-- Replace with your name or brand -->
        <h1>Vibrant Worlds</h1>

        <!-- Add a short description about yourself or your brand -->
        <p>Creating worlds, games, and stories.</p>

        <!-- All your buttons go here -->
        <nav class="button-stack" aria-label="Links">

          <!-- Ko-Fi -->
          <a class="button button-ko-fi" href="https://ko-fi.com/vibrantworlds" target="_blank" rel="noopener"><img
              class="icon" aria-hidden="true" src="images/icons/ko-fi.svg" alt="Ko-fi Logo">Support us on Ko-fi</a>

          <!-- Twitch -->
          <a class="button button-twitch" href="twitch.tv/oaster2000" target="_blank" rel="noopener"><img class="icon"
              aria-hidden="true" src="images/icons/twitch.svg" alt="Twitch Logo">Twitch</a>

          <!-- Bluesky -->
          <a class="button button-bluesky" href="https://bsky.app/profile/vibrantworlds.co.uk" target="_blank" rel="noopener"><img class="icon" aria-hidden="true"
              src="images/icons/bluesky.svg" alt="Bluesky Logo">Bluesky</a>

          <!-- YouTube -->
          <a class="button button-yt" href="https://www.youtube.com/@vibrant_worlds" target="_blank" rel="noopener"><img
              class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a>

          <!-- WorldAnvil -->
          <a class="button button-wa" href="https://www.youtube.com/@vibrant_worlds" target="_blank" rel="noopener"><img
              class="icon" aria-hidden="true" src="images/icons/worldanvil.svg" alt="YouTube Logo">Nonvyrox</a>

          <!-- Website -->
          <a class="button button-default" href="https://www.vibrantworlds.co.uk" target="_blank" rel="noopener"><img
              class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Vibrant Worlds
            Blog</a>

        </nav>
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        Created with <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>.
      </footer>

    </div>
  </div>

</body>

</html>
